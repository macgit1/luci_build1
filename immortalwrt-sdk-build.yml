# =============================================================================
# 文件名: immortalwrt-sdk-build.yml  (V4 修正版)
# 用途  : 基于【ImmortalWrt 官方 SDK】在 GitHub Actions 上编译单个 LuCI 插件
#         示例插件: luci-app-dockerman (Docker 管理界面)
#
# V4 修正内容（相对 V3）:
#   ✔ 产物过多: 关闭 SDK 默认"全选"开关(CONFIG_ALL / CONFIG_ALL_KMODS /
#     CONFIG_ALL_NONSHARED), 否则 defconfig 会把所有包设为选中, 编译依赖链时
#     连带产出上百个依赖包(官方文档明确提示要关掉这三项)
#   ✔ 产物过滤: 新增 COLLECT_ALL 开关(false 时只收插件本身及其显式依赖,
#     true 时收全部 —— 取决于你是否要连同依赖一起分发)
#   ✔ Release 为空: 增加 publish_release 开关 + permissions: contents: write,
#     真正执行 softprops/action-gh-release; 之前该步骤被注释, 只有 artifact
#     (artifact 在 run 页面, 不是仓库 Releases 页, 两者不是一回事)
#
# V3 修正内容（相对 v2）:
#   ✔ 修复 cp 自复制报错(退出码 1): 插件源码改用 actions/checkout 的
#     path: plugin 检出到独立子目录, 复制命令改为 cp -a plugin/.
#     旧写法 cp -a "${GITHUB_WORKSPACE}/." 会把工作区全部内容(包括解压出来的
#     sdk/、sdk-archive/、sha256sums)塞进插件包目录, cp 检测到源目录是目标的
#     祖先而报错: cp: cannot copy a directory, 'sdk', into itself, ...
#
# v2 修正内容（相对 v1）:
#   ✔ sha256sums 校验文件获取失败 → 自动回退官方源
#     (实测: sha256sums 只存在于 targets/<t>/<s>/ 这一级目录, releases 根目录
#      没有; 镜像可能缺失, 例如 mirrors.sdu.edu.cn 实测出现过 504 超时)
#   ✔ sha256sums 是全目录树校验合集(25.12.2/x86/64 实测 1344 行, 含 img.gz/
#     qcow2/vdi/vhdx/vmdk/iso/toolchain/kmods/packages 等各种条目, 且带 kmods/、
#     packages/ 相对路径) → 只精确提取 SDK 一行做校验, 不再对整文件执行
#     sha256sum -c (否则带路径条目全部报 "FAILED open or read")
#   ✔ 修复缓存 bug: 下载落盘目录改为 sdk-archive/, 与 actions/cache 的 path
#     声明保持一致; 缓存恢复步骤移到下载步骤之前(v1 中缓存声明了却拿不到东西)
#
# 与 OpenWrt 版的结构完全同构，差异点用 ⚠ 标出:
#   ⚠1 下载域名与文件名前缀 (immortalwrt-*)
#   ⚠2 版本号独立 (25.12.2 ≠ OpenWrt 25.12.6，修订号不跟随上游)
#   ⚠3 feeds 源指向 ImmortalWrt 自己的 fork (packages/luci 内容不同)
#   ⚠4 可选国内镜像加速
#   ⚠5 产物兼容性: 只能刷 ImmortalWrt 固件，与 OpenWrt 包不可互装
# =============================================================================

name: Build luci-app-dockerman (ImmortalWrt SDK)

on:
  workflow_dispatch:
    inputs:
      # ⚠2【可变】ImmortalWrt 的修订号独立发布、可跳号(如无 23.05.5)，
      #    以 https://downloads.immortalwrt.org/releases/ 实际列表为准。
      immortalwrt_version:
        description: "ImmortalWrt 版本号(独立修订号, 不跟随 OpenWrt)"
        required: true
        default: "25.12.2"
      target:
        description: "目标平台"
        required: true
        default: "x86"
      subtarget:
        description: "子平台"
        required: true
        default: "64"
      # 【可变】是否创建 GitHub Release(仓库 Releases 页的正式发布)
      # 【注意】false 时只上传 artifact(在 Actions run 页面, 默认保留 90 天)
      publish_release:
        description: "是否创建 GitHub Release(true/false)"
        required: true
        default: "false"

# 【不可变·V4 新增】Release 需要写权限; 只上传 artifact 时可改为 contents: read
permissions:
  contents: write

concurrency:
  group: immortalwrt-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      # 【不可变约定】make 目标名与包名必须与插件 Makefile 里的
      #   Package/<name> 一致，OpenWrt 与 ImmortalWrt 完全相同。
      PLUGIN_NAME: luci-app-dockerman
      PLUGIN_REPO: lisaac/luci-app-dockerman
      PLUGIN_BRANCH: master
      # 编译期还需要但不在任何 feed 里的依赖包(空格分隔, "owner/repo:branch" 格式)
      EXTRA_PKGS: "lisaac/luci-lib-docker:master"
      # feeds 里能解析到的依赖包名
      FEED_DEPS: "luci-lib-jsonc"
      # 【可变·V4 新增】产物收集范围:
      #   false = 只收插件本身 + EXTRA_PKGS + FEED_DEPS 对应的包(推荐, 体积小)
      #   true  = 收 bin/packages 下全部产物(依赖链上的所有包, 可能上百个)
      COLLECT_ALL: "false"

    steps:
      # -------------------------------------------------------------------------
      # ① 获取插件源码
      # 【不可变】actions/checkout@v4 + with.path 把源码检出到独立子目录 plugin/
      # 【注意·V3 修复】为什么必须用独立子目录:
      #   之前写法是 cp -a "${GITHUB_WORKSPACE}/." → 会把工作区"全部内容"(包括
      #   解压出来的 sdk/、sdk-archive/、sha256sums)复制进插件包目录, cp 检测到
      #   源目录是目标的祖先, 直接报错:
      #     cp: cannot copy a directory, 'sdk', into itself,
      #         'sdk/package/luci-app-dockerman/sdk'
      #   退出码 1, 流程中断。检出隔离到 plugin/ 后此问题根除。
      # 若 workflow 不在插件仓库内, 删除本步, 改用:
      #   git clone --depth 1 -b ${PLUGIN_BRANCH} \
      #     https://github.com/${PLUGIN_REPO}.git plugin
      # -------------------------------------------------------------------------
      - name: Checkout plugin source
        uses: actions/checkout@v4
        with:
          path: plugin   # 检出到 ./plugin, 与 sdk/ 等构建目录隔离

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc make git \
            curl wget tar unzip xz-utils zstd file rsync \
            python3 python3-dev python3-pip python3-setuptools \
            zlib1g-dev libncurses-dev libc6-dev

      # -------------------------------------------------------------------------
      # SDK 包缓存 —— 【不可变】必须放在"下载"步骤之前，恢复缓存才有意义;
      # path 必须与下载步骤的实际落盘目录 sdk-archive/ 一致(此为 v1 的 bug 修复)
      # 【可变】key 含版本/平台，版本变更自动失效
      # -------------------------------------------------------------------------
      - name: Restore SDK cache
        uses: actions/cache@v4
        with:
          path: sdk-archive
          key: immortalwrt-sdk-${{ inputs.immortalwrt_version }}-${{ inputs.target }}-${{ inputs.subtarget }}

      # -------------------------------------------------------------------------
      # ⚠1 解析文件名 → 下载 → 单行校验
      #
      # 域名: downloads.immortalwrt.org (OpenWrt 是 downloads.openwrt.org)
      # 文件前缀: immortalwrt-sdk-*        (OpenWrt 是 openwrt-sdk-*)
      #
      # 【不可变·事实】sha256sums 只在 targets/<target>/<subtarget>/ 这一级提供
      # 【注意·事实】部分镜像同步不全: 实测 mirrors.sdu.edu.cn 的该文件返回 504。
      #              所以 "所选源 → 官方源" 两级回退，官方源永远拿得到。
      # 【注意·事实】sha256sums 不是"只有 SDK 一行"，而是整个目标目录树的校验
      #              合集(25.12.2/x86/64 为 1344 行): .img.gz/.qcow2/.vdi/.vhdx/
      #              .vmdk/.iso 各种镜像格式 + kernel + toolchain + imagebuilder
      #              + 带 kmods/、packages/ 相对路径的条目。
      #              → 必须用 SDK 前缀精确过滤出那一行，只对单行执行校验。
      # 【不可变】SDK 文件名内嵌 gcc 版本(25.12.2 为 gcc-14.3.0_musl)，随发布
      #           变化，必须动态解析，不可硬编码。
      # 【可变】MIRROR 置空 = 官方源；国内构建可改:
      #   https://mirrors.ustc.edu.cn/immortalwrt/releases   (中科大, 实测可用)
      #   https://mirrors.vsean.net/openwrt                  (社区源, 实测可用)
      #   https://mirrors.sdu.edu.cn/immortalwrt/releases    (山大, 校验文件曾 504)
      # -------------------------------------------------------------------------
      - name: Resolve & download ImmortalWrt SDK
        run: |
          VER="${{ inputs.immortalwrt_version }}"
          TGT="${{ inputs.target }}"; SUB="${{ inputs.subtarget }}"
          MIRROR=""    # 【可变】镜像加速开关
          OFFICIAL="https://downloads.immortalwrt.org/releases/${VER}/targets/${TGT}/${SUB}"
          BASE="${MIRROR:-${OFFICIAL}}"

          # ---- ⓪ 缓存命中则跳过下载 (目录与缓存 path 对应) ----
          if [ -d sdk-archive ] && [ -n "$(ls sdk-archive 2>/dev/null)" ]; then
            SDK_FILE=$(ls sdk-archive | head -n1)
            echo "SDK_FILE=${SDK_FILE}" >> "$GITHUB_ENV"
            echo "== 缓存命中, 跳过下载: ${SDK_FILE} =="
            exit 0
          fi

          # ---- ① 取校验文件: 所选源失败自动回退官方源 ----
          mkdir -p sdk-archive
          curl -fsSL --max-time 30 "${BASE}/sha256sums" -o sha256sums \
            || { echo "!! 所选源无 sha256sums, 回退官方源"; \
                 curl -fsSL --max-time 30 "${OFFICIAL}/sha256sums" -o sha256sums; }
          [ -s sha256sums ] || { echo "!! sha256sums 两级获取均失败, 请更换镜像"; exit 1; }

          # ---- ② 精确提取 SDK 行 (该文件含上千条其他格式条目, 只取这一行) ----
          SDK_LINE=$(grep -E '\*?immortalwrt-sdk-[^[:space:]]+\.tar\.(zst|xz)$' sha256sums)
          [ -n "${SDK_LINE}" ] || { echo "!! sha256sums 中无 SDK 条目, 版本号写错了?"; exit 1; }
          SDK_FILE=$(grep -oE 'immortalwrt-sdk-[^[:space:]]+\.tar\.(zst|xz)' <<<"${SDK_LINE}")
          echo "SDK_FILE=${SDK_FILE}" >> "$GITHUB_ENV"
          echo "== 解析到 SDK: ${SDK_FILE} =="

          # ---- ③ 下载: 所选源失败自动回退官方源 ----
          curl -fSL --retry 3 -o "sdk-archive/${SDK_FILE}" "${BASE}/${SDK_FILE}" \
            || { echo "!! 所选源下载失败, 回退官方源"; \
                 curl -fSL --retry 3 -o "sdk-archive/${SDK_FILE}" "${OFFICIAL}/${SDK_FILE}"; }

          # ---- ④ 单行校验 (绝对不要对整个 sha256sums 执行 -c) ----
          ( cd sdk-archive && printf '%s\n' "${SDK_LINE}" | sha256sum -c - )

      # -------------------------------------------------------------------------
      # 解压
      # 【不可变】tar --strip-components=1 去掉包内第一层目录(目录名含 gcc 版本，
      #           不固定)，统一解到 ./sdk；新版 .tar.zst 用 --zstd，旧版 -J (xz)
      # -------------------------------------------------------------------------
      - name: Extract SDK
        run: |
          case "${SDK_FILE}" in
            *.tar.zst) TAROPT="--zstd" ;;
            *.tar.xz)  TAROPT="-J" ;;
          esac
          mkdir -p sdk && tar ${TAROPT} -xf "sdk-archive/${SDK_FILE}" -C sdk --strip-components=1
          ls sdk

      # -------------------------------------------------------------------------
      # ② 把插件和额外依赖包放进 SDK 的 package/ 目录
      # 【不可变】SDK 中 package/ 目录下的源码包会被 make 识别(无需注册 feed);
      #           package/ 里已有 SDK 自带目录，cp -r 是合并不是覆盖。
      # 【注意·V3 修复】只复制 plugin/ 子目录的内容(plugin/. 的"点"表示连
      #   隐藏文件一起拷)，绝不能复制整个工作区 —— 否则 sdk/ 自己也被塞进插件
      #   包目录，触发 "cannot copy a directory into itself"(退出码 1)。
      # -------------------------------------------------------------------------
      - name: Copy plugin & extra deps into SDK
        run: |
          mkdir -p "sdk/package/${PLUGIN_NAME}"
          cp -a plugin/. "sdk/package/${PLUGIN_NAME}/"
          for pkg in ${EXTRA_PKGS}; do
            repo="${pkg%%:*}"; branch="${pkg##*:}"
            name=$(basename "${repo}")
            git clone --depth 1 -b "${branch}" "https://github.com/${repo}.git" "/tmp/${name}"
            cp -a "/tmp/${name}" "sdk/package/${name}"
          done

      # -------------------------------------------------------------------------
      # ⚠3 刷新 feeds —— 命令与 OpenWrt 一模一样，但行为不同:
      #   ImmortalWrt SDK 内的 feeds.conf.default 指向它自己的 fork 仓库
      #   (immortalwrt/packages 等)，里面多出大量国内常用插件与补丁版本，
      #   与官方 openwrt/packages、openwrt/luci 的内容并不一致。
      # 【注意】因此"同一个插件"在两家 SDK 下解析出的依赖(如 luci-lib-jsonc、
      #   ucode 版本)可能不同，产物 ABI 以各自固件为准，不可互装 (⚠5)。
      # -------------------------------------------------------------------------
      - name: Update & install feeds
        working-directory: sdk
        run: |
          cat feeds.conf.default   # 打印实际 feed 列表，便于核对与排查
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # -------------------------------------------------------------------------
      # ⑦ 生成 .config 并选中要编译的包
      # 【V4 关键修复】必须先关掉 SDK 的三个"全选"开关, 否则产物爆炸:
      #   CONFIG_ALL             = 默认选中"全部用户态软件包"
      #   CONFIG_ALL_KMODS       = 默认选中"全部内核模块包"
      #   CONFIG_ALL_NONSHARED   = 默认选中"全部 target 专属包"
      #   官方文档《Using the SDK》原文提示: "You probably want to disable some
      #   default settings, which build every available package." —— 就是在说
      #   这三项。开着它们: 目标包依赖链一旦碰到内核/基础库, 会把成百上千个包
      #   一并选中并编译, 于是 bin/packages 下出现几十~上百个 .apk。
      # 【不可变】必须在 make defconfig 之前写入, defconfig 只补默认值, 不会推翻
      #           已显式写入的 =n。
      # 【不可变】CONFIG_PACKAGE_<包名>=y 命名规则 (y=编译进系统, m=可编成包)
      # -------------------------------------------------------------------------
      - name: Configure packages
        working-directory: sdk
        run: |
          echo "CONFIG_ALL=n"             >> .config
          echo "CONFIG_ALL_KMODS=n"       >> .config
          echo "CONFIG_ALL_NONSHARED=n"   >> .config
          echo "CONFIG_PACKAGE_${PLUGIN_NAME}=y" >> .config
          for d in ${FEED_DEPS}; do echo "CONFIG_PACKAGE_${d}=y" >> .config; done
          make defconfig
          # 确认: 目标包被选中, 且"全选"开关确实是 n
          grep -E "CONFIG_PACKAGE_${PLUGIN_NAME}=y" .config
          grep -E "^CONFIG_ALL(=|_KMODS=|_NONSHARED=)" .config || echo "!! 警告: 未找到 CONFIG_ALL* 开关"

      - name: Compile plugin (and dependencies)
        working-directory: sdk
        run: |
          make -j"$(nproc)" package/${PLUGIN_NAME}/compile V=s

      # -------------------------------------------------------------------------
      # ⑧ 收集产物 (V4: 默认只收"插件 + 显式依赖", 不再无脑收全部)
      # 【注意】为什么之前会有一大堆包: make package/<名>/compile 会连带编译
      #   依赖链上的每个包, 每个包都产出一个安装文件; 再叠加 SDK 默认的
      #   CONFIG_ALL* 全选开关, 就会把整个软件集合都编出来。
      # 【可变】COLLECT_ALL=true 时才保留全部产物(适合离线装机的完整依赖集)
      # 【不可变】25.12 起为 .apk; 24.10 及更早为 .ipk —— 两种后缀都匹配:
      #   apk 命名 <名>-<版本>.apk; ipk 命名 <名>_<版本>_<架构>.ipk
      # -------------------------------------------------------------------------
      - name: Collect artifacts
        run: |
          mkdir -p out
          names="${PLUGIN_NAME}"
          for p in ${EXTRA_PKGS}; do names="${names} $(basename "${p%%:*}")"; done
          names="${names} ${FEED_DEPS}"
          echo "本次目标包: ${names}"

          if [ "${COLLECT_ALL}" = "true" ]; then
            echo "== COLLECT_ALL=true, 收集全部产物 =="
            find sdk/bin/packages sdk/bin/targets -type f \
                 \( -name "*.apk" -o -name "*.ipk" \) ! -name "*debug*" \
                 -exec cp {} out/ \;
          else
            # 只按包名前缀精确匹配(注意: 不能误收 luci-app-dockerman 之外的同前缀包)
            for n in ${names}; do
              find sdk/bin/packages sdk/bin/targets -type f \
                   \( -name "${n}-*.apk" -o -name "${n}-*.ipk" -o -name "${n}_*.ipk" \) \
                   ! -name "*debug*" -exec cp {} out/ \;
            done
          fi

          echo "== 产物统计 =="
          ls -lh out
          echo "文件数: $(ls out | wc -l)"
          # 写入 Actions 运行摘要, 不用下载也能看清产出了什么
          {
            echo "### ${PLUGIN_NAME} 编译产物"
            echo ""
            echo "共 $(ls out | wc -l) 个文件 (COLLECT_ALL=${COLLECT_ALL})"
            echo ""
            echo '```'
            ls out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ -n "$(ls out 2>/dev/null)" ] || { echo "!! 没有编译产物"; exit 1; }

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ inputs.immortalwrt_version }}-${{ inputs.target }}-${{ inputs.subtarget }}-${{ env.PLUGIN_NAME }}
          path: out/*
          if-no-files-found: error

      # -------------------------------------------------------------------------
      # ⑨ 发布 Release (V4 新增/启用)
      # 【注意·为什么之前 Releases 页是空的】旧版这一步是注释掉的, 全程只做了
      #   upload-artifact —— artifact 出现在 run 页面底部, 90 天后自动清理,
      #   从来不会出现在仓库的 Releases 页; 两者是不同机制。
      # 【不可变】需要顶部 permissions: contents: write, 否则 403。
      # 【不可变】tag_name 必须全局唯一; 重复用同一 tag 会报 "already_exists"。
      # 【可变】tag 命名规则、是否 draft/prerelease 自行决定。
      # -------------------------------------------------------------------------
      - name: Publish release
        if: ${{ inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PLUGIN_NAME }}-${{ inputs.immortalwrt_version }}-${{ inputs.target }}-${{ inputs.subtarget }}
          name: ${{ env.PLUGIN_NAME }} for ImmortalWrt ${{ inputs.immortalwrt_version }} (${{ inputs.target }}/${{ inputs.subtarget }})
          body: |
            自动构建产物
            - 发行版: ImmortalWrt ${{ inputs.immortalwrt_version }}
            - 平台: ${{ inputs.target }}/${{ inputs.subtarget }}
            - 插件: ${{ env.PLUGIN_NAME }}
            - 产物格式: ImmortalWrt 25.12+ 为 .apk；24.10 及更早为 .ipk
          files: out/*
          fail_on_unmatched_files: true
